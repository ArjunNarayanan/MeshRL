<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesh Quest</title>
<style>
:root {
  --paper: #f3f5f7;
  --panel: #ffffff;
  --ink: #17242e;
  --muted: #5d6b77;
  --line: #d7dee5;
  --grid: rgba(31, 111, 214, 0.055);
  --grid-major: rgba(31, 111, 214, 0.1);
  --accent: #1f6fd6;
  --halo: rgba(31, 111, 214, 0.16);
  --glow: rgba(31, 111, 214, 0.75);
  --good: #2b8a4d;
  --warn: #d9962e;
  --bad: #cf4433;
  --face-quad: rgba(43, 138, 77, 0.1);
  --face-tri: rgba(31, 111, 214, 0.1);
  --face-2gon: rgba(207, 68, 51, 0.16);
  --face-big: rgba(217, 150, 46, 0.14);
  --face-degen: rgba(207, 68, 51, 0.22);
  --edge: #46545f;
  --edge-bdry: #17242e;
  --vertex-ring: #ffffff;
  --shadow: rgba(23, 36, 46, 0.14);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #101820;
    --panel: #18232d;
    --ink: #e4ecf2;
    --muted: #8b99a5;
    --line: #2a3743;
    --grid: rgba(90, 162, 240, 0.05);
    --grid-major: rgba(90, 162, 240, 0.09);
    --accent: #5aa2f0;
  --halo: rgba(90, 162, 240, 0.22);
  --glow: rgba(90, 162, 240, 0.9);
    --good: #43b06a;
    --warn: #e2a94f;
    --bad: #e26055;
    --face-quad: rgba(67, 176, 106, 0.13);
    --face-tri: rgba(90, 162, 240, 0.13);
    --face-2gon: rgba(226, 96, 85, 0.2);
    --face-big: rgba(226, 169, 79, 0.16);
    --face-degen: rgba(226, 96, 85, 0.26);
    --edge: #9fb0bd;
    --edge-bdry: #dfe9f1;
    --vertex-ring: #101820;
    --shadow: rgba(0, 0, 0, 0.45);
  }
}
:root[data-theme="dark"] {
  --paper: #101820;
  --panel: #18232d;
  --ink: #e4ecf2;
  --muted: #8b99a5;
  --line: #2a3743;
  --grid: rgba(90, 162, 240, 0.05);
  --grid-major: rgba(90, 162, 240, 0.09);
  --accent: #5aa2f0;
  --halo: rgba(90, 162, 240, 0.22);
  --glow: rgba(90, 162, 240, 0.9);
  --good: #43b06a;
  --warn: #e2a94f;
  --bad: #e26055;
  --face-quad: rgba(67, 176, 106, 0.13);
  --face-tri: rgba(90, 162, 240, 0.13);
  --face-2gon: rgba(226, 96, 85, 0.2);
  --face-big: rgba(226, 169, 79, 0.16);
  --face-degen: rgba(226, 96, 85, 0.26);
  --edge: #9fb0bd;
  --edge-bdry: #dfe9f1;
  --vertex-ring: #101820;
  --shadow: rgba(0, 0, 0, 0.45);
}
:root[data-theme="light"] {
  --paper: #f3f5f7;
  --panel: #ffffff;
  --ink: #17242e;
  --muted: #5d6b77;
  --line: #d7dee5;
  --grid: rgba(31, 111, 214, 0.055);
  --grid-major: rgba(31, 111, 214, 0.1);
  --accent: #1f6fd6;
  --halo: rgba(31, 111, 214, 0.16);
  --glow: rgba(31, 111, 214, 0.75);
  --good: #2b8a4d;
  --warn: #d9962e;
  --bad: #cf4433;
  --face-quad: rgba(43, 138, 77, 0.1);
  --face-tri: rgba(31, 111, 214, 0.1);
  --face-2gon: rgba(207, 68, 51, 0.16);
  --face-big: rgba(217, 150, 46, 0.14);
  --face-degen: rgba(207, 68, 51, 0.22);
  --edge: #46545f;
  --edge-bdry: #17242e;
  --vertex-ring: #ffffff;
  --shadow: rgba(23, 36, 46, 0.14);
}

* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font-family: "Avenir Next", Seravek, "Segoe UI", -apple-system, sans-serif;
  color: var(--ink);
  background: var(--paper);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  height: 100vh;
  height: 100dvh;
}
header, .toolbar, #stage {
  user-select: none;
  -webkit-user-select: none;
}
#stage { touch-action: manipulation; }
button, select {
  touch-action: manipulation;
  -webkit-tap-highlight-color: transparent;
}
.mono {
  font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
}

header {
  display: flex;
  align-items: stretch;
  gap: 20px;
  flex-wrap: wrap;
  padding: 12px 20px 10px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.brand h1 {
  font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-wrap: balance;
}
.brand .sub {
  font-size: 11.5px;
  color: var(--muted);
  letter-spacing: 0.02em;
  margin-top: 2px;
}
.readouts { display: flex; gap: 2px; align-items: stretch; }
.readout {
  min-width: 66px;
  padding: 4px 12px 5px;
  border-left: 1px solid var(--line);
  text-align: center;
}
.readout:first-child { border-left: none; }
.readout .label {
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.14em;
  color: var(--muted);
}
.readout .value {
  font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  font-variant-numeric: tabular-nums;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.25;
}
.readout.at-par .value { color: var(--good); }
.readout.alert .value { color: var(--bad); }
.spacer { flex: 1; }
.controls { display: flex; gap: 8px; align-items: center; }

select, button {
  font: inherit;
  font-size: 13px;
  color: var(--ink);
  padding: 6px 12px;
  border-radius: 7px;
  border: 1px solid var(--line);
  background: var(--panel);
  cursor: pointer;
}
button:hover, select:hover { border-color: var(--accent); }
button:disabled { opacity: 0.4; cursor: default; }
button:focus-visible, select:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

.toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  padding: 8px 20px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.mode kbd {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 10.5px;
  opacity: 0.55;
  margin-right: 5px;
}
.mode.active {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.mode.active kbd { opacity: 0.7; }
label.auto {
  font-size: 12.5px;
  color: var(--muted);
  display: flex;
  gap: 5px;
  align-items: center;
  cursor: pointer;
}
.hint { font-size: 12.5px; color: var(--muted); margin-left: 6px; }

#stage {
  flex: 1;
  position: relative;
  overflow: hidden;
  background-image:
    linear-gradient(var(--grid-major) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid-major) 1px, transparent 1px),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
}
#canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
#canvas.panning { cursor: grabbing; }
#canvas.panning * { pointer-events: none; }
#confetti { position: absolute; inset: 0; pointer-events: none; }

.face { stroke: none; }
.face.d4 { fill: var(--face-quad); }
.face.d3 { fill: var(--face-tri); }
.face.d2 { fill: var(--face-2gon); }
.face.dbig { fill: var(--face-big); }
.face.degen { fill: var(--face-degen); }
.edge { stroke: var(--edge); stroke-width: 2; fill: none; pointer-events: none; }
.edge.boundary { stroke: var(--edge-bdry); stroke-width: 3; }
.edge.glow { filter: drop-shadow(0 0 4px var(--glow)); }
.vertex.glow { filter: drop-shadow(0 0 5px var(--glow)); }
.edge.near { stroke: var(--accent) !important; stroke-width: 5 !important; }
.vertex { stroke: var(--vertex-ring); stroke-width: 1.5; }
.vertex.user { stroke: var(--edge-bdry); stroke-width: 2.5; }
.vertex.ok { fill: var(--good); }
.vertex.off1 { fill: var(--warn); }
.vertex.off2 { fill: var(--bad); }
.vertex.near { stroke: var(--accent); stroke-width: 4; }
.vertex.selected { stroke: var(--accent); stroke-width: 4; }
.vlabel {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 9px;
  font-weight: 700;
  fill: var(--vertex-ring);
  text-anchor: middle;
  pointer-events: none;
}
.heat { fill: var(--bad); pointer-events: none; }
.dim { opacity: 0.25; pointer-events: none; }
#canvas.has-target { cursor: pointer; }

#toast {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--paper);
  padding: 9px 16px;
  border-radius: 8px;
  font-size: 13px;
  opacity: 0;
  transition: opacity 0.25s;
  pointer-events: none;
  max-width: 80%;
}
#toast.show { opacity: 0.95; }

.lvlarrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--panel);
  color: var(--muted);
  font-size: 20px;
  cursor: pointer;
  padding: 0;
  box-shadow: 0 4px 12px var(--shadow);
  display: none;
  transition: transform 0.15s;
}
.lvlarrow.show { display: block; }
.lvlarrow:hover {
  transform: translateY(-50%) scale(1.1);
  color: var(--ink);
  border-color: var(--accent);
}
#next.win {
  background: var(--good);
  border-color: var(--good);
  color: #fff;
  width: 60px;
  height: 60px;
  font-size: 27px;
  box-shadow: 0 6px 18px var(--shadow);
}

#star {
  position: absolute;
  right: 60px;
  bottom: 16px;
  display: inline-block;
  font-size: 12.5px;
  text-decoration: none;
  color: var(--muted);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 17px;
  padding: 7px 14px;
  box-shadow: 0 2px 8px var(--shadow);
  transition: transform 0.15s;
}
#star:hover { color: var(--ink); border-color: var(--accent); transform: translateY(-1px); }
#star:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
#log-export {
  position: absolute;
  right: 16px;
  bottom: 16px;
  width: 34px;
  height: 34px;
  border-radius: 50%;
  padding: 0;
  font-size: 15px;
  color: var(--muted);
}
#log-export:hover { color: var(--ink); }

#tutcard {
  position: absolute;
  left: 20px;
  top: 50%;
  transform: translateY(-50%);
  width: clamp(260px, 24vw, 360px);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 15px 16px 12px;
  box-shadow: 0 10px 30px var(--shadow);
  display: none;
}
#tutcard.show { display: block; }
#tutcard .eyebrow {
  font-size: 12px;
  letter-spacing: 0.3em;
  color: var(--accent);
  margin-bottom: 14px;
}
#tutcard .body { font-size: 15px; line-height: 1.45; }
#tutcard .actions {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  margin-top: 13px;
  gap: 4px;
}
#tut-next {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-size: 14.5px;
  padding: 9px 12px;
  border-radius: 9px;
}
#tut-next.hidden { display: none; }
#tut-skip {
  position: absolute;
  top: 8px;
  right: 10px;
  border: none;
  background: none;
  color: var(--muted);
  font-size: 24px;
  line-height: 1;
  padding: 4px 10px;
  cursor: pointer;
}
#tut-skip:hover { color: var(--ink); }
#tut-open {
  position: absolute;
  left: 20px;
  top: calc(50% + 64px);
  transform: translateY(-50%);
  width: 74px;
  height: 74px;
  border-radius: 50%;
  border: 1px solid var(--line);
  background: var(--panel);
  font-size: 36px;
  padding: 0;
  cursor: pointer;
  box-shadow: 0 0 0 5px var(--halo), 0 4px 12px var(--shadow);
  animation: halo-breathe 2.8s ease-in-out infinite;
  transition: transform 0.15s;
}
#tut-open:hover { transform: translateY(-50%) scale(1.1); border-color: var(--accent); }
@keyframes halo-breathe {
  0%, 100% { box-shadow: 0 0 0 4px var(--halo), 0 4px 12px var(--shadow); }
  50% { box-shadow: 0 0 0 9px var(--halo), 0 4px 12px var(--shadow); }
}
@media (prefers-reduced-motion: reduce) {
  #tut-open { animation: none; }
}
#tutcard.show ~ #tut-open { display: none; }
@media (max-width: 720px) {
  #tutcard {
    left: 8px;
    right: 8px;
    top: auto;
    bottom: 8px;
    transform: none;
    width: auto;
    padding: 11px 13px 9px;
    border-radius: 12px;
    max-height: 40vh;
    overflow-y: auto;
  }
  #tutcard .eyebrow { font-size: 11px; margin-bottom: 7px; }
  #tutcard .body { font-size: 14px; line-height: 1.4; }
  #tutcard svg { max-height: 76px; margin-bottom: 7px; }
  #tutcard .actions { margin-top: 9px; }
  #tut-next { font-size: 14px; padding: 9px 12px; }
  #tut-skip { font-size: 21px; top: 5px; right: 6px; }
  #tutcard.show ~ #toast { bottom: 46vh; }
  /* card open: hand the header/toolbar space to the board */
  body.card-open > .toolbar { display: none; }
  body.card-open > header { display: none; }
  body.card-open.chip-step > header { display: flex; }
  #tut-open { top: auto; bottom: 14px; left: 14px; transform: none; }
  #tut-open:hover { transform: none; }
}

/* tutorial card illustrations */
#tutcard svg {
  display: block;
  width: 100%;
  height: auto;
  max-height: 190px;
  margin-bottom: 10px;
}
.tvis-line { stroke: var(--edge); stroke-width: 2.5; fill: none; }
.tvis-dot { fill: var(--accent); }
.tvis-blush { fill: var(--bad); }
.tvis-tile { fill: var(--good); opacity: 0; animation: tvis-tile 2.7s infinite; }
.tvis-tile.t2 { animation-delay: 0.35s; }
.tvis-tile.t3 { animation-delay: 0.7s; }
@keyframes tvis-tile { 0% { opacity: 0; } 30%, 80% { opacity: 0.35; } 100% { opacity: 0; } }
.tvis-ray {
  stroke: var(--accent);
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: tvis-draw 3s infinite;
}
.tvis-ray.r2 { animation-delay: 0.3s; }
.tvis-ray.r3 { animation-delay: 0.6s; }
.tvis-ray.r4 { animation-delay: 0.9s; }
@keyframes tvis-draw { 0% { stroke-dashoffset: 1; } 45%, 90% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
.tvis-pop {
  transform-box: fill-box;
  transform-origin: center;
  animation: tvis-pop 1.8s ease-in-out infinite;
}
@keyframes tvis-pop { 0%, 15% { transform: scale(0); } 50%, 85% { transform: scale(1); } 100% { transform: scale(0); } }
.tvis-draw {
  stroke: var(--accent);
  stroke-width: 3;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
  animation: tvis-draw 2s ease-in-out infinite;
}
.tvis-good {
  fill: var(--good);
  transform-box: fill-box;
  transform-origin: center;
  animation: tvis-pop 2.4s ease-in-out infinite;
}
.tvis-good.g2 { animation-delay: 0.25s; }
.tvis-good.g3 { animation-delay: 0.5s; }
.tvis-cell {
  fill: var(--good);
  stroke: var(--paper);
  opacity: 0;
  animation: tvis-tile 2.6s infinite;
}
.tvis-pulse { animation: tutpulse 1.3s ease-in-out infinite; }
.tvis-spoke { stroke: var(--edge); stroke-width: 2; }
.tvis-ok-label {
  fill: var(--good);
  font-size: 9px;
  font-weight: 700;
  font-family: ui-monospace, Menlo, monospace;
}
.tvis-flat-label {
  fill: var(--bad);
  font-size: 9px;
  font-weight: 700;
  font-family: ui-monospace, Menlo, monospace;
}
.tvis-badge { fill: var(--accent); }
.tvis-badge-text {
  fill: #fff;
  font-size: 15px;
  font-weight: 700;
  text-anchor: middle;
  font-family: ui-monospace, Menlo, monospace;
}
@media (prefers-reduced-motion: reduce) {
  .tvis-tile, .tvis-cell, .tvis-ray, .tvis-pop, .tvis-draw, .tvis-good { animation: none; }
  .tvis-tile, .tvis-cell { opacity: 0.35; }
  .tvis-ray, .tvis-draw { stroke-dashoffset: 0; }
}

@keyframes tutpulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
.edge.tut-target {
  stroke: var(--accent) !important;
  stroke-width: 6 !important;
  animation: tutpulse 1.3s ease-in-out infinite;
}
.vertex.tut-target {
  stroke: var(--accent) !important;
  stroke-width: 5 !important;
  animation: tutpulse 1.3s ease-in-out infinite;
}
.readout.tut-target { box-shadow: 0 0 0 2px var(--accent); border-radius: 8px; }
@media (prefers-reduced-motion: reduce) {
  .edge.tut-target, .vertex.tut-target { animation: none; }
}

.credit {
  position: absolute;
  left: 16px;
  bottom: 16px;
  font-size: 11px;
  color: var(--muted);
  pointer-events: none;
}

@media (prefers-reduced-motion: reduce) {
  #next { transition: none; }
  #toast { transition: none; }
}

/* touch devices: no hover previews to explain, no keyboard */
@media (hover: none) {
  .mode kbd, #undo kbd, #smoothbtn kbd { display: none; }
  .hint { display: none; }
}

/* compact phone layout */
@media (max-width: 720px) {
  header { padding: 8px 12px 6px; gap: 8px; row-gap: 4px; }
  .brand h1 { font-size: 14px; letter-spacing: 0.16em; }
  .brand .sub { display: none; }
  .readouts {
    order: 3;
    width: 100%;
    justify-content: space-between;
    overflow-x: auto;
  }
  .readout { min-width: 0; flex: 1; padding: 2px 6px 3px; }
  .readout .value { font-size: 16px; }
  .controls { margin-left: auto; }
  select, button { padding: 8px 10px; }
  .toolbar { padding: 6px 8px; gap: 6px; }
  .toolbar .mode {
    flex: 1;
    min-height: 42px;
    padding: 6px 2px;
    font-size: 12.5px;
    white-space: nowrap;
  }
  label.auto { font-size: 12px; }
  .credit { display: none; }
  #star { font-size: 11.5px; padding: 6px 11px; right: 54px; bottom: 12px; }
  #log-export { right: 12px; bottom: 12px; }
  body.card-open #star, body.card-open #log-export { display: none; }
  .lvlarrow { width: 52px; height: 52px; font-size: 22px; }
  #next.win { width: 64px; height: 64px; font-size: 30px; }
}
</style>
<script data-goatcounter="https://arjunnarayanan.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header>
  <div class="brand">
    <h1>MESH QUEST</h1>
    <div class="sub">a quad-meshing puzzle</div>
  </div>
  <div class="readouts">
    <div class="readout" id="r-score"><div class="label">Score</div><div class="value" id="s-vertex">–</div></div>
    <div class="readout" id="r-par"><div class="label">Par</div><div class="value" id="s-par">–</div></div>
    <div class="readout" id="r-quality"><div class="label">Quality</div><div class="value" id="s-quality">–</div></div>
    <div class="readout"><div class="label">Moves</div><div class="value" id="s-moves">–</div></div>
    <div class="readout"><div class="label">Best</div><div class="value" id="s-best">–</div></div>
  </div>
  <div class="spacer"></div>
  <div class="controls">
    <select id="shape" aria-label="Level"></select>
    <button id="reset">New game</button>
  </div>
</header>
<div class="toolbar">
  <button class="mode" data-mode="insert_vertex"><kbd>1</kbd>+ Vertex</button>
  <button class="mode" data-mode="delete_vertex"><kbd>2</kbd>&minus; Vertex</button>
  <button class="mode" data-mode="insert_edge"><kbd>3</kbd>+ Edge</button>
  <button class="mode" data-mode="delete_edge"><kbd>4</kbd>&minus; Edge</button>
  <button id="undo"><kbd style="font-family:ui-monospace,Menlo,monospace;font-size:10.5px;opacity:.55;margin-right:5px">u</kbd>Undo</button>
  <button id="smoothbtn"><kbd style="font-family:ui-monospace,Menlo,monospace;font-size:10.5px;opacity:.55;margin-right:5px">s</kbd>Smooth</button>
  <label class="auto"><input type="checkbox" id="autosmooth" checked> auto-smooth</label>
  <span class="hint" id="hint"></span>
</div>
<div id="stage">
  <svg id="canvas"></svg>
  <canvas id="confetti"></canvas>
  <button id="prev" class="lvlarrow" title="Previous level">&larr;</button>

<script>
/* Mesh Quest engine: JavaScript port of the game subset of src/tiler.py.
 *
 * Faithful to the Python implementation including ID assignment order, so
 * states can be diffed against the Python engine op-for-op. Verified by
 * replaying identical op traces through both engines (see game/js/tests).
 *
 * IDs are tagged strings: h3 (half-edge), v2 (vertex), f1 (face), b0 (boundary).
 */
"use strict";

const TARGET_ANGLE = 90;
const FACE_DESIRED = 4;
const QUALITY_THRESHOLD = 0.4;

// numpy-style round-half-to-even (np.round); angles here are non-negative
function roundHalfEven(x) {
  const f = Math.floor(x);
  const d = x - f;
  if (d > 0.5) return f + 1;
  if (d < 0.5) return f;
  return f % 2 === 0 ? f : f + 1;
}

function desiredFromAngle(angle, target = TARGET_ANGLE) {
  return Math.max(roundHalfEven(angle / target) + 1, 2);
}

const INTERIOR_DESIRED = desiredFromAngle(360) - 1; // 4
const BOUNDARY_DESIRED = desiredFromAngle(180); // 3

function num(id) {
  return parseInt(id.slice(1), 10);
}

class GameError extends Error {}

class Mesh {
  constructor() {
    this.he = new Map(); // tagged id -> {face,next,prev,twin,source,target}
    this.nodeType = new Map(); // tagged id -> "half_edge"|"vertex"|"face"|"boundary"
    this.coords = new Map(); // numeric vid -> [x, y]
    this.userVerts = new Set(); // numeric
    this.boundaryVerts = new Set(); // numeric
    this.vertexDeg = new Map(); // vertex id -> degree
    this.faceDeg = new Map(); // face id -> degree
    this.faceHE = new Map(); // face id -> Set of half-edge ids (insertion order)
    this.nextH = 0;
    this.nextV = 0;
    this.nextF = 0;
    this.nextB = 0;
  }

  static fromFaceLoops(loops, coords) {
    const m = new Mesh();
    const vertexIds = new Set();
    for (const loop of loops) for (const v of loop) vertexIds.add(v);

    m.nextH = loops.reduce((s, l) => s + l.length, 0);
    m.nextV = vertexIds.size;
    m.nextF = loops.length;

    for (let i = 0; i < m.nextH; i++) {
      m.he.set("h" + i, { face: null, next: null, prev: null, twin: null, source: null, target: null });
      m.nodeType.set("h" + i, "half_edge");
    }
    for (const v of vertexIds) {
      m.nodeType.set("v" + v, "vertex");
      m.coords.set(v, [coords[v][0], coords[v][1]]);
      m.userVerts.add(v);
    }
    for (let f = 0; f < m.nextF; f++) {
      m.nodeType.set("f" + f, "face");
      m.faceHE.set("f" + f, new Set());
    }

    // next/prev, source/target, face associations, loop by loop
    let start = 0;
    for (let fi = 0; fi < loops.length; fi++) {
      const loop = loops[fi];
      const n = loop.length;
      for (let i = 0; i < n; i++) {
        const h = "h" + (start + i);
        const hn = "h" + (start + ((i + 1) % n));
        const rec = m.he.get(h);
        rec.next = hn;
        m.he.get(hn).prev = h;
        rec.source = "v" + loop[i];
        rec.target = "v" + loop[(i + 1) % n];
        rec.face = "f" + fi;
        m.faceHE.get("f" + fi).add(h);
      }
      start += n;
    }

    // twins (iteration in half-edge id order, matching the Python dict order)
    const pair = new Map(); // "src|dst" -> hid
    for (let i = 0; i < m.nextH; i++) {
      const h = "h" + i;
      const r = m.he.get(h);
      pair.set(r.source + "|" + r.target, h);
    }
    for (const [key, h] of pair) {
      const [src, dst] = key.split("|");
      const rev = pair.get(dst + "|" + src);
      if (rev !== undefined) {
        m.he.get(h).twin = rev;
        m.he.get(rev).twin = h;
      } else {
        const b = "b" + m.nextB;
        m.nextB += 1;
        m.nodeType.set(b, "boundary");
        m.he.set(b, { face: null, next: null, prev: null, twin: h, source: dst, target: src });
        m.he.get(h).twin = b;
      }
    }

    // degrees: every mesh edge is represented by two directed records
    // (half-edge/half-edge in the interior, half-edge/boundary at the rim),
    // so a vertex's degree is half its incidence count over all records
    for (const v of vertexIds) m.vertexDeg.set("v" + v, 0);
    for (const [id, type] of m.nodeType) {
      if (type !== "half_edge" && type !== "boundary") continue;
      const r = m.he.get(id);
      m.vertexDeg.set(r.source, m.vertexDeg.get(r.source) + 1);
      m.vertexDeg.set(r.target, m.vertexDeg.get(r.target) + 1);
    }
    for (const [v, d] of m.vertexDeg) m.vertexDeg.set(v, d / 2);

    for (let f = 0; f < m.nextF; f++) m.faceDeg.set("f" + f, loops[f].length);

    for (const [id, type] of m.nodeType) {
      if (type === "half_edge" && m.onBoundary(id)) {
        m.boundaryVerts.add(num(m.he.get(id).source));
      }
    }
    return m;
  }

  clone() {
    const m = new Mesh();
    for (const [k, v] of this.he) m.he.set(k, { ...v });
    for (const [k, v] of this.nodeType) m.nodeType.set(k, v);
    for (const [k, v] of this.coords) m.coords.set(k, [v[0], v[1]]);
    m.userVerts = new Set(this.userVerts);
    m.boundaryVerts = new Set(this.boundaryVerts);
    m.vertexDeg = new Map(this.vertexDeg);
    m.faceDeg = new Map(this.faceDeg);
    for (const [k, v] of this.faceHE) m.faceHE.set(k, new Set(v));
    m.nextH = this.nextH; m.nextV = this.nextV; m.nextF = this.nextF; m.nextB = this.nextB;
    return m;
  }

  isHalfEdge(h) { return this.nodeType.get(h) === "half_edge"; }
  isBoundaryHalfEdge(h) { return this.nodeType.get(h) === "boundary"; }
  onBoundary(h) { return this.he.get(this.he.get(h).twin).face === null; }

  halfEdgeList() {
    const out = [];
    for (const [id, t] of this.nodeType) if (t === "half_edge") out.push(id);
    return out;
  }
  vertexList() {
    const out = [];
    for (const [id, t] of this.nodeType) if (t === "vertex") out.push(id);
    return out;
  }
  faceList() {
    const out = [];
    for (const [id, t] of this.nodeType) if (t === "face") out.push(id);
    return out;
  }

  faceLoop(h) {
    const loop = [h];
    let cur = this.he.get(h).next;
    while (cur !== h) {
      loop.push(cur);
      cur = this.he.get(cur).next;
    }
    return loop;
  }

  firstFaceHalfEdge(f) {
    for (const h of this.faceHE.get(f)) return h;
    throw new GameError("face has no half-edges: " + f);
  }

  // --- construction helpers (ID order matches Python) ---------------------

  createFace() {
    const f = "f" + this.nextF;
    this.nextF += 1;
    this.nodeType.set(f, "face");
    this.faceHE.set(f, new Set());
    return f;
  }

  createVertex(coord, onBdry) {
    const v = "v" + this.nextV;
    this.nodeType.set(v, "vertex");
    if (coord) this.coords.set(this.nextV, [coord[0], coord[1]]);
    if (onBdry) this.boundaryVerts.add(this.nextV);
    this.nextV += 1;
    return v;
  }

  createHalfEdge(nextH, prevH) {
    const nr = this.he.get(nextH);
    const pr = this.he.get(prevH);
    const h = "h" + this.nextH;
    this.nextH += 1;
    this.nodeType.set(h, "half_edge");
    this.he.set(h, {
      face: nr.face, next: nextH, prev: prevH,
      twin: null, source: pr.target, target: nr.source,
    });
    nr.prev = h;
    pr.next = h;
    if (nr.face !== null) this.faceHE.get(nr.face).add(h);
    return h;
  }

  createBoundaryHalfEdge(targetV, sourceV) {
    const b = "b" + this.nextB;
    this.nextB += 1;
    this.nodeType.set(b, "boundary");
    this.he.set(b, { face: null, next: null, prev: null, twin: null, source: sourceV, target: targetV });
    return b;
  }

  associateTwin(a, b) {
    this.he.get(a).twin = b;
    this.he.get(b).twin = a;
  }

  setTargetVertex(h, v) {
    const r = this.he.get(h);
    const twin = this.he.get(r.twin);
    r.target = v;
    twin.source = v;
  }

  // --- edit operations -----------------------------------------------------

  isValidEdgeInsert(h, k) {
    if (!this.isHalfEdge(h)) return false;
    const f = this.he.get(h).face;
    return k >= 0 && k < this.faceDeg.get(f) - 1;
  }

  insertHalfEdge(h, k) {
    if (!this.isValidEdgeInsert(h, k)) throw new GameError("Invalid edge insert");
    const f = this.he.get(h).face;
    this.faceDeg.set(f, this.faceDeg.get(f) - k);
    const nf = this.createFace();
    this.faceDeg.set(nf, k + 2);

    let cur = h;
    for (let c = 0; c < k + 1; c++) {
      this.faceHE.get(f).delete(cur);
      this.he.get(cur).face = nf;
      this.faceHE.get(nf).add(cur);
      cur = this.he.get(cur).next;
    }

    const newFaceNext = h;
    const newFacePrev = this.he.get(cur).prev;
    const oldFaceNext = cur;
    const oldFacePrev = this.he.get(h).prev;

    const srcV = this.he.get(newFacePrev).target;
    const dstV = this.he.get(h).source;
    this.vertexDeg.set(srcV, this.vertexDeg.get(srcV) + 1);
    this.vertexDeg.set(dstV, this.vertexDeg.get(dstV) + 1);

    const a = this.createHalfEdge(newFaceNext, newFacePrev);
    const b = this.createHalfEdge(oldFaceNext, oldFacePrev);
    this.associateTwin(a, b);
  }

  midpoint(v1, v2) {
    const a = this.coords.get(num(v1));
    const b = this.coords.get(num(v2));
    return [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
  }

  insertVertex(h) {
    if (!this.isHalfEdge(h)) throw new GameError("Unknown edge");
    if (this.onBoundary(h)) this._insertBoundaryVertex(h);
    else this._insertInteriorVertex(h);
  }

  _insertBoundaryVertex(h) {
    const r = this.he.get(h);
    const curTarget = r.target;
    const curSource = r.source;
    const nv = this.createVertex(this.midpoint(curTarget, curSource), true);
    this.vertexDeg.set(nv, 2);

    const nextH = r.next;
    this.setTargetVertex(h, nv);
    const nh = this.createHalfEdge(nextH, h);
    const nb = this.createBoundaryHalfEdge(nv, curTarget);
    this.associateTwin(nh, nb);
    this.faceDeg.set(r.face, this.faceDeg.get(r.face) + 1);
  }

  _insertInteriorVertex(h) {
    const r = this.he.get(h);
    const nextH = r.next;
    const twinH = r.twin;
    const twinPrev = this.he.get(twinH).prev;

    const curTarget = r.target;
    const curSource = r.source;
    const nv = this.createVertex(this.midpoint(curTarget, curSource), false);
    this.vertexDeg.set(nv, 2);

    this.setTargetVertex(h, nv);
    const a = this.createHalfEdge(nextH, h);
    const b = this.createHalfEdge(twinH, twinPrev);
    this.associateTwin(a, b);

    this.faceDeg.set(r.face, this.faceDeg.get(r.face) + 1);
    const tf = this.he.get(twinH).face;
    this.faceDeg.set(tf, this.faceDeg.get(tf) + 1);
  }

  isUserVertex(v) { return this.userVerts.has(num(v)); }

  isValidDeleteSourceVertex(h) {
    if (!this.isHalfEdge(h)) return false;
    const v = this.he.get(h).source;
    if (this.isUserVertex(v)) return false;
    if (this.vertexDeg.get(v) !== 2) return false;
    const f = this.he.get(h).face;
    if (this.faceDeg.get(f) < 3) return false;
    if (!this.onBoundary(h)) {
      const tf = this.he.get(this.he.get(h).twin).face;
      if (this.faceDeg.get(tf) < 3) return false;
    }
    return true;
  }

  _removeHalfEdgePair(h) {
    const twin = this.he.get(h).twin;
    for (const id of [h, twin]) {
      const r = this.he.get(id);
      if (r.face !== null && this.faceHE.has(r.face)) this.faceHE.get(r.face).delete(id);
      this.he.delete(id);
      this.nodeType.delete(id);
    }
  }

  _removeVertex(v) {
    this.nodeType.delete(v);
    this.vertexDeg.delete(v);
    this.coords.delete(num(v));
    this.boundaryVerts.delete(num(v));
  }

  deleteSourceVertex(h) {
    if (!this.isValidDeleteSourceVertex(h)) throw new GameError("Vertex not deletable");
    if (this.onBoundary(h)) this._deleteBoundaryVertex(h);
    else this._deleteInteriorVertex(h);
  }

  _deleteBoundaryVertex(h) {
    const r = this.he.get(h);
    const src = r.source;
    const nextH = r.next;
    const prevH = r.prev;
    this.setTargetVertex(prevH, r.target);
    this.he.get(prevH).next = nextH;
    this.he.get(nextH).prev = prevH;
    this.faceDeg.set(r.face, this.faceDeg.get(r.face) - 1);
    this._removeHalfEdgePair(h);
    this._removeVertex(src);
  }

  _deleteInteriorVertex(h) {
    const r = this.he.get(h);
    const src = r.source;
    const nextH = r.next;
    const prevH = r.prev;
    const twinH = r.twin;
    const nextTwin = this.he.get(twinH).next;
    const prevTwin = this.he.get(twinH).prev;

    this.setTargetVertex(prevH, r.target);
    this.he.get(prevH).next = nextH;
    this.he.get(nextH).prev = prevH;
    this.he.get(prevTwin).next = nextTwin;
    this.he.get(nextTwin).prev = prevTwin;

    this.faceDeg.set(r.face, this.faceDeg.get(r.face) - 1);
    const tf = this.he.get(twinH).face;
    this.faceDeg.set(tf, this.faceDeg.get(tf) - 1);

    this._removeHalfEdgePair(h);
    this._removeVertex(src);
  }

  isValidDeleteHalfEdge(h) {
    if (!this.isHalfEdge(h)) return false;
    if (this.onBoundary(h)) return false;
    const r = this.he.get(h);
    if (this.vertexDeg.get(r.source) <= 2 || this.vertexDeg.get(r.target) <= 2) return false;
    const tf = this.he.get(r.twin).face;
    if (r.face === tf) return false;
    return true;
  }

  deleteHalfEdge(h) {
    if (!this.isValidDeleteHalfEdge(h)) throw new GameError("This edge cannot be deleted");
    const r = this.he.get(h);
    const nextH = r.next;
    const prevH = r.prev;
    const twinH = r.twin;
    const prevTwin = this.he.get(twinH).prev;
    const nextTwin = this.he.get(twinH).next;

    this.vertexDeg.set(r.source, this.vertexDeg.get(r.source) - 1);
    this.vertexDeg.set(r.target, this.vertexDeg.get(r.target) - 1);

    const curFace = r.face;
    const twinFace = this.he.get(twinH).face;
    this.faceDeg.set(curFace, this.faceDeg.get(curFace) + this.faceDeg.get(twinFace) - 2);

    for (const he of Array.from(this.faceHE.get(twinFace))) {
      this.he.get(he).face = curFace;
      this.faceHE.get(curFace).add(he);
    }
    this.nodeType.delete(twinFace);
    this.faceHE.delete(twinFace);
    this.faceDeg.delete(twinFace);

    this.he.get(prevH).next = nextTwin;
    this.he.get(nextTwin).prev = prevH;
    this.he.get(prevTwin).next = nextH;
    this.he.get(nextH).prev = prevTwin;
    this._removeHalfEdgePair(h);
  }

  // --- geometry -----------------------------------------------------------

  halfEdgeAngles() {
    const out = new Map();
    for (const [id, t] of this.nodeType) {
      if (t !== "half_edge") continue;
      const r = this.he.get(id);
      const c = this.coords.get(num(r.source));
      const n = this.coords.get(num(r.target));
      const p = this.coords.get(num(this.he.get(r.prev).source));
      const v1 = [n[0] - c[0], n[1] - c[1]];
      const v2 = [p[0] - c[0], p[1] - c[1]];
      const dot = v1[0] * v2[0] + v1[1] * v2[1];
      const det = v1[0] * v2[1] - v1[1] * v2[0];
      let ang = (Math.atan2(det, dot) * 180) / Math.PI;
      if (ang < 0) ang += 360;
      out.set(id, ang);
    }
    return out;
  }

  smooth(numIter) {
    // mirrors Tiler.smooth_vertices: fixed 0/1 neighbor structure, then
    // numIter rounds of averaging with per-vertex divisors
    const verts = this.vertexList().map(num);
    const idx = new Map(verts.map((v, i) => [v, i]));
    const nbrs = verts.map(() => []);

    for (const [id, t] of this.nodeType) {
      if (t !== "half_edge") continue;
      const r = this.he.get(id);
      const s = num(r.source);
      const d = num(r.target);
      if (this.onBoundary(id)) {
        if (!this.userVerts.has(s)) nbrs[idx.get(s)].push(idx.get(d));
        if (!this.userVerts.has(d)) nbrs[idx.get(d)].push(idx.get(s));
      } else if (!this.boundaryVerts.has(s) && !this.userVerts.has(s)) {
        nbrs[idx.get(s)].push(idx.get(d));
      }
    }

    const div = verts.map((v) => {
      if (this.userVerts.has(v)) return 1;
      if (this.boundaryVerts.has(v)) return 2;
      return this.vertexDeg.get("v" + v);
    });

    let cur = verts.map((v) => {
      const c = this.coords.get(v);
      return [c[0], c[1]];
    });
    for (let it = 0; it < numIter; it++) {
      const next = verts.map((v, i) => {
        if (this.userVerts.has(v)) return [cur[i][0], cur[i][1]];
        let x = 0, y = 0;
        for (const j of nbrs[i]) { x += cur[j][0]; y += cur[j][1]; }
        return [x / div[i], y / div[i]];
      });
      cur = next;
    }
    verts.forEach((v, i) => this.coords.set(v, cur[i]));
  }
}

// --- shapes -----------------------------------------------------------------

function regularPolygon(n, phase = 0) {
  const pts = [];
  for (let k = 0; k < n; k++) {
    const a = phase + (2 * Math.PI * k) / n;
    pts.push([Math.cos(a), Math.sin(a)]);
  }
  return pts;
}

function starPolygon() {
  const inner = Math.cos((72 * Math.PI) / 180) / Math.cos((36 * Math.PI) / 180);
  const pts = [];
  for (let k = 0; k < 5; k++) {
    const tip = ((90 + 72 * k) * Math.PI) / 180;
    const notch = ((126 + 72 * k) * Math.PI) / 180;
    pts.push([Math.cos(tip), Math.sin(tip)]);
    pts.push([inner * Math.cos(notch), inner * Math.sin(notch)]);
  }
  return pts;
}

function semicirclePolygon() {
  const pts = [[-1, 0], [1, 0]];
  for (let k = 1; k <= 5; k++) {
    const t = (30 * k * Math.PI) / 180;
    pts.push([Math.cos(t), Math.sin(t)]);
  }
  return pts;
}

function pacmanPolygon() {
  const pts = [[0, 0]];
  for (let k = 0; k < 7; k++) {
    const t = ((45 + 45 * k) * Math.PI) / 180;
    pts.push([Math.cos(t), Math.sin(t)]);
  }
  return pts;
}

function gearPolygon(teeth = 6, outer = 1.0, root = 0.62) {
  const pts = [];
  const w = (2 * Math.PI) / teeth;
  for (let k = 0; k < teeth; k++) {
    const base = w * k;
    for (const [frac, rad] of [[0.05, outer], [0.45, outer], [0.55, root], [0.95, root]]) {
      const t = base + frac * w;
      pts.push([rad * Math.cos(t), rad * Math.sin(t)]);
    }
  }
  return pts;
}

// Both rings put the hole-to-rim slit between two mid-edge points, which want
// degree 3 and are already satisfied by the slit: it belongs to a perfect mesh
// and never has to be deleted.
function triforceRing() {
  const coords = {};
  for (let k = 0; k < 3; k++) {
    const t = ((90 + 120 * k) * Math.PI) / 180;
    coords[k] = [Math.cos(t), Math.sin(t)];
    coords[k + 3] = [0.4 * Math.cos(t), 0.4 * Math.sin(t)];
  }
  coords[6] = [(coords[0][0] + coords[1][0]) / 2, (coords[0][1] + coords[1][1]) / 2];
  coords[7] = [(coords[3][0] + coords[4][0]) / 2, (coords[3][1] + coords[4][1]) / 2];
  return {
    loops: [[0, 6, 7, 3, 5, 4, 7, 6, 1, 2]],
    coords,
    desired: { 0: 2, 1: 2, 2: 2, 3: 4, 4: 4, 5: 4, 6: 3, 7: 3 },
  };
}

function interiorAngles(loop, coords) {
  const n = loop.length;
  const out = {};
  for (let i = 0; i < n; i++) {
    const c = coords[loop[i]];
    const p = coords[loop[(i - 1 + n) % n]];
    const nx = coords[loop[(i + 1) % n]];
    const v1 = [nx[0] - c[0], nx[1] - c[1]];
    const v2 = [p[0] - c[0], p[1] - c[1]];
    const dot = v1[0] * v2[0] + v1[1] * v2[1];
    const det = v1[0] * v2[1] - v1[1] * v2[0];
    let ang = (Math.atan2(det, dot) * 180) / Math.PI;
    if (ang < 0) ang += 360;
    out[loop[i]] = ang;
  }
  return out;
}

function simplePolygon(pts) {
  return () => {
    const coords = {};
    pts.forEach((p, i) => (coords[i] = [p[0], p[1]]));
    const loop = pts.map((_, i) => i);
    const angles = interiorAngles(loop, coords);
    const desired = {};
    for (const v of loop) desired[v] = desiredFromAngle(angles[v]);
    return { loops: [loop], coords, desired };
  };
}

function squareHole() {
  const coords = {
    0: [0, 0], 1: [0.5, 0], 2: [0.5, 0.25], 3: [0.25, 0.25], 4: [0.25, 0.75],
    5: [0.75, 0.75], 6: [0.75, 0.25], 7: [1, 0], 8: [1, 1], 9: [0, 1],
  };
  const degrees = [2, 3, 3, 4, 4, 4, 4, 2, 2, 2];
  const desired = {};
  degrees.forEach((d, i) => { desired[i] = d; });
  return { loops: [[0, 1, 2, 3, 4, 5, 6, 2, 1, 7, 8, 9]], coords, desired };
}

// --- game -------------------------------------------------------------------

class Game {
  constructor(shape = "L-shape", storage = null) {
    this.storage = storage; // {get(shape), set(shape, moves)} or null
    this.reset(shape);
  }

  reset(shape) {
    shape = shape || this.shape;
    if (!SHAPES[shape]) throw new GameError("Unknown shape: " + shape);
    const { loops, coords, desired } = SHAPES[shape]();
    this.shape = shape;
    this.mesh = Mesh.fromFaceLoops(loops, coords);
    this.initialDesired = {};
    for (const k of Object.keys(desired)) this.initialDesired[k] = desired[k];
    this.undoStack = [];
    this.moves = 0;
    this.recordJustSet = false;
    this.par = this._computePar();
  }

  desiredDegree(vid) {
    if (vid in this.initialDesired) return this.initialDesired[vid];
    return this.mesh.boundaryVerts.has(vid) ? BOUNDARY_DESIRED : INTERIOR_DESIRED;
  }

  _computePar() {
    const m = this.mesh;
    let cornerExcess = 0;
    for (const v of m.vertexList()) {
      const vid = num(v);
      const generic = m.boundaryVerts.has(vid) ? BOUNDARY_DESIRED : INTERIOR_DESIRED;
      cornerExcess += this.desiredDegree(vid) - generic;
    }
    let numEdges = 0;
    const seen = new Set();
    for (const h of m.halfEdgeList()) {
      if (seen.has(h)) continue;
      seen.add(h);
      seen.add(m.he.get(h).twin);
      numEdges += 1;
    }
    const chi = m.vertexList().length - numEdges + m.faceList().length;
    return Math.abs(cornerExcess + 4 * chi);
  }

  resolveChord(a, b) {
    const m = this.mesh;
    for (const f of m.faceList()) {
      const loop = m.faceLoop(m.firstFaceHalfEdge(f));
      const srcs = loop.map((h) => num(m.he.get(h).source));
      const n = loop.length;
      for (let i = 0; i < n; i++) {
        if (srcs[i] !== a) continue;
        for (let k = 0; k < n - 1; k++) {
          if (srcs[(i + k + 1) % n] === b && m.isValidEdgeInsert(loop[i], k)) {
            return [loop[i], k];
          }
        }
      }
    }
    return null;
  }

  deleteCandidate(vid) {
    const m = this.mesh;
    const v = "v" + vid;
    for (const [id, t] of m.nodeType) {
      if (t !== "half_edge") continue;
      if (m.he.get(id).source === v && m.isValidDeleteSourceVertex(id)) return id;
    }
    return null;
  }

  applyOp(op, params, smoothAfter = false) {
    const snapshot = this.mesh.clone();
    try {
      if (op === "insert_vertex") {
        const h = "h" + params.edge;
        if (!this.mesh.isHalfEdge(h)) throw new GameError("Unknown edge");
        this.mesh.insertVertex(h);
      } else if (op === "delete_edge") {
        const h = "h" + params.edge;
        this.mesh.deleteHalfEdge(h);
      } else if (op === "delete_vertex") {
        const h = this.deleteCandidate(params.vertex);
        if (h === null) {
          throw new GameError("Vertex not deletable: must be degree 2 and not an original corner");
        }
        this.mesh.deleteSourceVertex(h);
      } else if (op === "insert_edge") {
        const chord = this.resolveChord(params.a, params.b) || this.resolveChord(params.b, params.a);
        if (chord === null) throw new GameError("Vertices must lie on the same face");
        this.mesh.insertHalfEdge(chord[0], chord[1]);
      } else {
        throw new GameError("Unknown operation: " + op);
      }
      if (smoothAfter) this.mesh.smooth(2);
    } catch (e) {
      this.mesh = snapshot;
      throw e;
    }
    this.undoStack.push(snapshot);
    this.moves += 1;
    this.recordJustSet = false;
    this._checkRecord();
  }

  smooth(numIter = 3) {
    this.undoStack.push(this.mesh.clone());
    this.mesh.smooth(numIter);
    this.recordJustSet = false;
    this._checkRecord();
  }

  undo() {
    if (!this.undoStack.length) throw new GameError("Nothing to undo");
    this.mesh = this.undoStack.pop();
    this.moves = Math.max(0, this.moves - 1);
    this.recordJustSet = false;
  }

  _currentScores() {
    const m = this.mesh;
    let vertexScore = 0;
    for (const v of m.vertexList()) {
      vertexScore += Math.abs(m.vertexDeg.get(v) - this.desiredDegree(num(v)));
    }
    let faceScore = 0;
    for (const f of m.faceList()) faceScore += Math.abs(m.faceDeg.get(f) - FACE_DESIRED);
    let minQ = 1;
    for (const a of m.halfEdgeAngles().values()) {
      minQ = Math.min(minQ, Math.sin((a * Math.PI) / 180));
    }
    return [vertexScore, faceScore, minQ];
  }

  _checkRecord() {
    const [vs, fs, mq] = this._currentScores();
    const won = vs === this.par && fs === 0 && mq >= QUALITY_THRESHOLD;
    if (!won || !this.storage) return;
    const best = this.storage.get(this.shape);
    if (best == null || this.moves < best) {
      this.storage.set(this.shape, this.moves);
      this.recordJustSet = true;
    }
  }

  serialize() {
    const m = this.mesh;
    const angles = m.halfEdgeAngles();
    const cornerQ = new Map();
    for (const [h, a] of angles) cornerQ.set(h, Math.sin((a * Math.PI) / 180));
    const vertexQ = new Map();
    const faceQ = new Map();
    let minQuality = 1;
    for (const [h, q] of cornerQ) {
      const v = num(m.he.get(h).source);
      const f = num(m.he.get(h).face);
      vertexQ.set(v, Math.min(q, vertexQ.has(v) ? vertexQ.get(v) : 1));
      faceQ.set(f, Math.min(q, faceQ.has(f) ? faceQ.get(f) : 1));
      minQuality = Math.min(minQuality, q);
    }

    const vertices = m.vertexList().map((v) => {
      const vid = num(v);
      const c = m.coords.get(vid);
      return {
        id: vid, x: c[0], y: c[1],
        degree: m.vertexDeg.get(v),
        desired: this.desiredDegree(vid),
        boundary: m.boundaryVerts.has(vid),
        user: m.userVerts.has(vid),
        deletable: this.deleteCandidate(vid) !== null,
        quality: vertexQ.has(vid) ? vertexQ.get(vid) : 1,
      };
    });

    const edges = [];
    const seen = new Set();
    for (const h of m.halfEdgeList()) {
      if (seen.has(h)) continue;
      seen.add(h);
      seen.add(m.he.get(h).twin);
      const r = m.he.get(h);
      edges.push({
        id: num(h), v1: num(r.source), v2: num(r.target),
        boundary: m.onBoundary(h),
        deletable: m.isValidDeleteHalfEdge(h),
      });
    }

    const faces = [];
    const insertablePairs = [];
    for (const f of m.faceList()) {
      const loop = m.faceLoop(m.firstFaceHalfEdge(f));
      const srcs = loop.map((h) => num(m.he.get(h).source));
      faces.push({
        id: num(f), degree: m.faceDeg.get(f), vertices: srcs,
        quality: faceQ.has(num(f)) ? faceQ.get(num(f)) : 1,
      });
      const n = loop.length;
      for (let i = 0; i < n; i++) {
        for (let k = 0; k < n - 1; k++) {
          const b = srcs[(i + k + 1) % n];
          if (srcs[i] !== b && m.isValidEdgeInsert(loop[i], k)) {
            insertablePairs.push([srcs[i], b]);
          }
        }
      }
    }

    let vertexScore = 0;
    let defectSum = 0;
    for (const v of vertices) {
      vertexScore += Math.abs(v.degree - v.desired);
      defectSum += v.desired - v.degree;
    }
    let faceScore = 0;
    for (const f of faces) faceScore += Math.abs(f.degree - FACE_DESIRED);
    let angleScore = 0;
    for (const a of angles.values()) angleScore += Math.abs(a - TARGET_ANGLE) / TARGET_ANGLE;

    return {
      shape: this.shape,
      shapes: Object.keys(SHAPES),
      vertices, edges, faces,
      insertable_pairs: insertablePairs,
      scores: {
        vertex: vertexScore, face: faceScore,
        angle: angleScore, defect_sum: defectSum, min_quality: minQuality,
      },
      par: this.par,
      quality_threshold: QUALITY_THRESHOLD,
      best: this.storage ? this.storage.get(this.shape) ?? null : null,
      new_record: this.recordJustSet,
      moves: this.moves,
      can_undo: this.undoStack.length > 0,
    };
  }
}

// step-1 illustration drawn from the actual level: its outline, being tiled
function makeShapeTilesSvg(st) {
  const xs = st.vertices.map(v => v.x), ys = st.vertices.map(v => v.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const sc = Math.min(100 / Math.max(maxX - minX, 1e-9), 64 / Math.max(maxY - minY, 1e-9));
  const X = x => 60 + (x - (minX + maxX) / 2) * sc;
  const Y = y => 42 - (y - (minY + maxY) / 2) * sc;
  const pos = {};
  st.vertices.forEach(v => { pos[v.id] = X(v.x).toFixed(1) + "," + Y(v.y).toFixed(1); });
  const polys = st.faces.map(f => f.vertices.map(id => pos[id]).join(" "));
  const clip = "tclip" + Math.random().toString(36).slice(2, 7);
  let cells = "";
  for (let gx = 0; gx < 5; gx++) {
    for (let gy = 0; gy < 4; gy++) {
      cells += `<rect class="tvis-cell" style="animation-delay:${(((gx + gy) % 5) * 0.3).toFixed(1)}s"
        x="${8 + gx * 21}" y="${5 + gy * 18.5}" width="19" height="16.5"></rect>`;
    }
  }
  return `<svg viewBox="0 0 120 84">
    <clipPath id="${clip}">${polys.map(p => `<polygon points="${p}"></polygon>`).join("")}</clipPath>
    <g clip-path="url(#${clip})">${cells}</g>
    ${polys.map(p => `<polygon class="tvis-line" points="${p}" fill="none"></polygon>`).join("")}
  </svg>`;
}

      text: "Why two hubs? One hub in the middle is prettier — but it ends up with <b>5</b> lines when it wants 4. Too many is just as unhappy as too few, so that costs 6. With two hubs nobody is over-stuffed: 4 dots are just a little short, and 4 is the best anyone can do here." },
  ],
  "Triangle": st => [
    { svgRaw: makeShapeTilesSvg(st), chip: "r-par", next: "Let's go!",
      text: "The Triangle's <b>Par is 1</b> — one dot must stay imperfect. Here's the classic way." },
    { svg: "pop", mode: "insert_vertex", require: { op: "insert_vertex", edge: [0, 1] },
      text: "A dot on every side. First: the glowing edge." },
    { svg: "pop", mode: "insert_vertex", require: { op: "insert_vertex", edge: [1, 2] },
      text: "Second side!" },
    { svg: "pop", mode: "insert_vertex", require: { op: "insert_vertex", edge: [2, 0] },
      text: "Third side!" },
    { svg: "draw", mode: "insert_edge", require: { op: "insert_edge", pair: [3, 5] },
      text: "Draw a line between two of the new dots." },
    { svg: "pop", mode: "insert_vertex", require: { op: "insert_vertex", edge: [3, 5] },
      text: "Pop a dot in the middle of that new line." },
    { svg: "draw", mode: "insert_edge", require: { op: "insert_edge", pair: [6, 4] },
      text: "Connect the middle dot to the last side dot." },
    { svg: "happy", next: "Play!",
      text: "Three tiles — par! The middle dot wants 4 lines but has 3: the unavoidable 1. This trick is called <b>Catmull&ndash;Clark</b>." },
  ],
};

function buildTutorial(shape, st) {
  if (shape === "L-shape") return { steps: TUTORIAL_L };
  if (SOLUTION_TUTORIALS[shape]) {
    return { steps: SOLUTION_TUTORIALS[shape](st) };
  }
  // one hint card, tailored to this shape. No scripted actions: a generic
  // "pop a dot first" prompt walks players off levels whose solves are pure
  // chords (Pac-Man, Plus, Gear).
  return {
    steps: [{
      svgRaw: makeShapeTilesSvg(st),
      chip: "r-par",
      next: "Play!",
      text: (LEVEL_HINTS[shape] || "Cut it into 4-sided tiles.")
        + `<br><br>${LEVEL_NOTES[shape] || ""}`,
    }],
  };
}

let tut = null; // { i, steps } while a card sequence is active
const seenNotes = (() => {
  try { return new Set(JSON.parse(localStorage.getItem("meshquest-notes") || "[]")); }
  catch { return new Set(); }
})();

function tutStep() { return tut ? tut.steps[tut.i] : null; }

function sameSet(a, b) {
  return a.length === b.length && a.every(x => b.includes(x));
}

function tutAllows(kind, id) {
  const s = tutStep();
  if (!s) return true;
  if (!s.require) return false; // info steps: board locked
  const r = s.require;
  if (r.op === "insert_vertex" || r.op === "delete_edge") {
    if (kind !== "edge") return false;
    if (!r.edge) return true; // unconstrained step: any edge
    const e = state.edges.find(e => e.id === id);
    return !!e && sameSet([e.v1, e.v2], r.edge);
  }
  if (r.op === "insert_edge") {
    if (kind !== "vertex") return false;
    return !r.pair || r.pair.includes(id);
  }
  return false;
}

function showCard(eyebrow, html, nextLabel, onNext, onSkip) {
  const card = document.getElementById("tutcard");
  document.getElementById("tut-eyebrow").textContent = eyebrow;
  document.getElementById("tut-body").innerHTML = html;
  const nextBtn = document.getElementById("tut-next");
  const skipBtn = document.getElementById("tut-skip");
  nextBtn.classList.toggle("hidden", !nextLabel);
  if (nextLabel) nextBtn.textContent = nextLabel;
  nextBtn.onclick = onNext || null;
  skipBtn.onclick = onSkip || (() => hideCard());
  card.classList.add("show");
  if (state) render();
}

function hideCard() {
  document.getElementById("tutcard").classList.remove("show");
  if (state) render();
}

function tutShow() {
  const s = tutStep();
  if (s.mode) setMode(s.mode, true);
  const dots = tut.steps.length > 1
    ? tut.steps.map((_, k) => (k <= tut.i ? "●" : "○")).join(" ")
    : game.shape;
  const body = (s.svgRaw || (s.svg ? TUT_SVG[s.svg] : "")) + `<div>${s.text}</div>`;
  showCard(dots, body, s.next || null, s.next ? tutAdvance : null, tutEnd);
  render();
}

function tutAdvance() {
  tut.i += 1;
  if (tut.i >= tut.steps.length) tutEnd();
  else tutShow();
}

function tutEnd() {
  logEvent("tutorial_end", { at_step: tut ? tut.i : null });
  tut = null;
  try { localStorage.setItem("meshquest-tutorial", "done"); } catch {}
  hideCard();
  // any moves made during a card sequence are real: progress is kept
  render();
}

function tutStart() {
  hideCard();
  document.getElementById("autosmooth").checked = true;
  // scripted walkthroughs need their exact starting board; hint cards run on
  // whatever the player already has, so in-progress work is never lost
  const scripted = game.shape === "L-shape" || !!SOLUTION_TUTORIALS[game.shape];
  if (scripted) game.reset(game.shape);
  state = game.serialize();
  selectedVertex = null;
  const { steps } = buildTutorial(game.shape, state);
  tut = { i: 0, steps };
  logEvent("tutorial_start", { steps: steps.length });
  tutShow();
}

function tutCheck(desc) {
  const s = tutStep();
  if (!s || !s.require) return;
  const r = s.require;
  if (r.op !== desc.op) return;
  const want = r.edge || r.pair;
  if (!want || sameSet(desc.verts, want)) tutAdvance();
}

function maybeShowNote(shape) {
  if (tut || !LEVEL_NOTES[shape] || seenNotes.has(shape)) return;
  const dismiss = () => {
    seenNotes.add(shape);
    try { localStorage.setItem("meshquest-notes", JSON.stringify([...seenNotes])); } catch {}
    hideCard();
  };
  showCard(`Level note — ${shape}`, LEVEL_NOTES[shape], "Got it", dismiss, dismiss);
}

const HINTS = {
  insert_vertex: "Click any edge to split it with a midpoint vertex.",
  delete_vertex: "Click a highlighted vertex — degree 2 and not an original corner.",
  insert_edge: "Click two vertices on the same face to connect them.",
  delete_edge: "Click an interior edge to delete it and merge its two faces.",
};

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), 2600);
}

function refresh() {
  state = game.serialize();
  selectedVertex = null;
  render();
}

function doOp(op, params) {
  const auto = document.getElementById("autosmooth").checked;
  let verts = [];
  if (op === "insert_vertex" || op === "delete_edge") {
    const e = state.edges.find(e => e.id === params.edge);
    if (e) verts = [e.v1, e.v2];
  } else if (op === "insert_edge") {
    verts = [params.a, params.b];
  }
  try {
    game.applyOp(op, params, auto);
  } catch (e) {
    logEvent("op_rejected", { op, verts, error: e.message });
    toast(e.message);
    return;
  }
  refresh();
  logEvent("op", { op, verts, moves: state.moves, scores: state.scores });
  tutCheck({ op, verts });
}

function partnerMap() {
  const map = {};
  for (const [a, b] of state.insertable_pairs) {
    (map[a] = map[a] || new Set()).add(b);
    (map[b] = map[b] || new Set()).add(a);
  }
  return map;
}

function render() {
  const svg = document.getElementById("canvas");
  svg.setAttribute("class", mode === "insert_vertex" || mode === "delete_edge" ? "edge-mode" : "");
  // narrow screens: while a card is open the header/toolbar are dead weight
  // (the tool is auto-selected), so give that space to the board — except on
  // steps that spotlight a readout chip, which need the header visible.
  const cardEl = document.getElementById("tutcard");
  const cardOpen = cardEl.classList.contains("show");
  const stepNow = tutStep();
  document.body.classList.toggle("card-open", cardOpen);
  document.body.classList.toggle("chip-step", !!(stepNow && stepNow.chip));
  const W = svg.clientWidth, H = svg.clientHeight;
  const M = Math.min(60, Math.max(28, Math.min(W, H) * 0.08));
  // when the tutorial/note card is open on a wide screen it sits on the left;
  // reserve that band so it never covers the geometry
  const leftPad = cardOpen && W > 720 ? cardEl.offsetWidth + 20 + 36 : M;
  const xs = state.vertices.map(v => v.x), ys = state.vertices.map(v => v.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  // every level scales into one fixed square box, so the layout — and the
  // nav arrows anchored to the box — is identical across all levels
  const availW = W - leftPad - M;
  // on narrow screens the card is a bottom sheet: reserve its band vertically
  const bottomPad = cardOpen && W <= 720 ? cardEl.offsetHeight + 16 : 0;
  const availH = H - 2 * M - bottomPad;
  const box = Math.max(110, Math.min(availW - (W > 720 ? 150 : 110), availH));
  const boxCX = leftPad + availW / 2;
  const boxCY = M + availH / 2;
  const scale = Math.min(box / Math.max(maxX - minX, 1e-9),
                         box / Math.max(maxY - minY, 1e-9));
  const X = x => boxCX + (x - (minX + maxX) / 2) * scale + view.x;
  const Y = y => boxCY - (y - (minY + maxY) / 2) * scale + view.y;

  const pos = {};
  for (const v of state.vertices) pos[v.id] = [X(v.x), Y(v.y)];

  const partners = partnerMap();
  let out = "";

  for (const f of state.faces) {
    const pts = f.vertices.map(id => pos[id].join(",")).join(" ");
    let cls = f.degree === 4 ? "d4" : f.degree === 3 ? "d3" : f.degree === 2 ? "d2" : "dbig";
    if (f.quality < state.quality_threshold) cls = "degen";
    out += `<polygon class="face ${cls}" points="${pts}"></polygon>`;
  }

  const groups = {};
  for (const e of state.edges) {
    const key = Math.min(e.v1, e.v2) + "-" + Math.max(e.v1, e.v2);
    (groups[key] = groups[key] || []).push(e);
  }
  hitEdges = [];
  for (const group of Object.values(groups)) {
    group.forEach((e, i) => {
      const [x1, y1] = pos[e.v1], [x2, y2] = pos[e.v2];
      const off = (i - (group.length - 1) / 2) * 26;
      const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy) || 1;
      const cx = (x1 + x2) / 2 - dy / len * off, cy = (y1 + y2) / 2 + dx / len * off;
      const d = `M ${x1} ${y1} Q ${cx} ${cy} ${x2} ${y2}`;
      let dim = mode === "delete_edge" && !e.deletable ? "dim" : "";
      let tutCls = "";
      const ts = tutStep();
      if (ts && ts.require) {
        if (tutAllows("edge", e.id)) tutCls = "tut-target";
        else dim = "dim";
      }
      const samples = [];
      for (let t = 0; t <= 1.001; t += 0.125) {
        const u = 1 - t;
        samples.push([u * u * x1 + 2 * t * u * cx + t * t * x2,
                      u * u * y1 + 2 * t * u * cy + t * t * y2]);
      }
      hitEdges.push({ id: e.id, deletable: e.deletable, samples });
      // soft glow marks every legal target for the current tool
      const eligible = mode === "insert_vertex"
        || (mode === "delete_edge" && e.deletable);
      const glow = eligible && !dim && !tutCls && tutAllows("edge", e.id) ? "glow" : "";
      out += `<g class="${dim}">
        <path class="edge ${e.boundary ? "boundary" : ""} ${tutCls} ${glow}" data-edge="${e.id}" d="${d}"></path>
      </g>`;
    });
  }

  hitVerts = [];
  for (const v of state.vertices) {
    const defect = v.degree - v.desired;
    const cls = defect === 0 ? "ok" : Math.abs(defect) === 1 ? "off1" : "off2";
    let actionable = false, dim = false;
    if (mode === "delete_vertex") { actionable = v.deletable; dim = !v.deletable; }
    if (mode === "insert_edge") {
      actionable = true;
      if (selectedVertex !== null && selectedVertex !== v.id) {
        dim = !(partners[selectedVertex] && partners[selectedVertex].has(v.id));
        actionable = !dim;
      }
    }
    let tutCls = "";
    const ts = tutStep();
    if (ts) {
      if (ts.require && ts.require.op === "insert_edge") {
        if (tutAllows("vertex", v.id)) tutCls = "tut-target";
        else dim = true;
      } else if (ts.require) {
        dim = false; // edge steps: leave vertices visible but inert
      } else if (ts.vertex === v.id) {
        tutCls = "tut-target"; // info-step spotlight
      }
    }
    const sel = v.id === selectedVertex ? "selected" : "";
    const [x, y] = pos[v.id];
    const r = v.user ? 10 : 8.5;
    hitVerts.push({ id: v.id, x, y, eligible: actionable });
    const heat = v.quality < state.quality_threshold
      ? `<circle class="heat" cx="${x}" cy="${y}" r="19"
           opacity="${Math.min(0.4, (state.quality_threshold - Math.max(v.quality, -1)) * 0.3).toFixed(2)}"></circle>`
      : "";
    out += `<g class="${dim ? "dim" : ""}">
      ${heat}
      <circle class="vertex ${cls} ${v.user ? "user" : ""} ${sel} ${tutCls} ${
        actionable && !dim && !tutCls && tutAllows("vertex", v.id) ? "glow" : ""}"
              data-vertex="${v.id}" cx="${x}" cy="${y}" r="${r}">
        <title>v${v.id} — degree ${v.degree} / desired ${v.desired}${v.user ? " — corner" : ""}</title>
      </circle>
      ${defect !== 0 ? `<text class="vlabel" x="${x}" y="${y + 3}">${defect > 0 ? "+" : ""}${defect}</text>` : ""}
    </g>`;
  }

  svg.innerHTML = out;
  hoverTarget = null;

  const s = state.scores;
  document.getElementById("s-vertex").textContent = s.vertex;
  document.getElementById("s-par").textContent = state.par;
  document.getElementById("s-quality").textContent = s.min_quality.toFixed(2);
  document.getElementById("s-moves").textContent = state.moves;
  document.getElementById("s-best").textContent = state.best ?? "–";
  document.getElementById("r-score").classList.toggle("at-par", s.vertex === state.par);
  document.getElementById("r-quality").classList.toggle("alert", s.min_quality < state.quality_threshold);
  const locked = !!tut;
  document.getElementById("undo").disabled = !state.can_undo;
  document.getElementById("smoothbtn").disabled = locked;
  document.getElementById("reset").disabled = locked;
  document.getElementById("shape").disabled = locked;
  document.getElementById("autosmooth").disabled = locked;
  document.getElementById("hint").textContent = HINTS[mode];
  const ts2 = tutStep();
  document.getElementById("r-score").classList.toggle("tut-target", !!ts2 && ts2.chip === "r-score");
  document.getElementById("r-par").classList.toggle("tut-target", !!ts2 && ts2.chip === "r-par");

  const sel2 = document.getElementById("shape");
  if (sel2.options.length === 0) {
    for (const name of state.shapes) {
      const o = document.createElement("option");
      o.value = o.textContent = name;
      sel2.appendChild(o);
    }
  }
  sel2.value = state.shape;

  const isWon = s.vertex === state.par && s.face === 0
      && s.min_quality >= state.quality_threshold;
  const shapes = state.shapes;
  const idx = shapes.indexOf(state.shape);
  const nextShape = shapes[(idx + 1) % shapes.length];
  const prevShape = shapes[(idx - 1 + shapes.length) % shapes.length];
  const nextBtn = document.getElementById("next");
  const prevBtn = document.getElementById("prev");
  nextBtn.classList.toggle("show", !tut);
  prevBtn.classList.toggle("show", !tut);
  nextBtn.classList.toggle("win", isWon);
  nextBtn.title = "Next level: " + nextShape;
  prevBtn.title = "Previous level: " + prevShape;
  // arrows anchor to the fixed box, never to the mesh: globally constant
  prevBtn.style.left = Math.max(boxCX - box / 2 - 70, 8) + "px";
  nextBtn.style.left = Math.min(boxCX + box / 2 + 24, W - 66) + "px";
  prevBtn.style.top = boxCY + "px";
  nextBtn.style.top = boxCY + "px";
  if (isWon && !wasWon) {
    confettiBurst();
    logEvent("win", { moves: state.moves, new_record: state.new_record });
    if (state.new_record) toast(`\u{1F3C6} New record: ${state.moves} moves`);
  }
  wasWon = isWon;

  // the classic trap: at par with all quads, but a degenerate corner blocks
  // the win. Teach it the moment it happens.
  const isNearWin = !isWon && s.vertex === state.par && s.face === 0
      && s.min_quality < state.quality_threshold;
  if (isNearWin && !wasNearWin) {
    wasNearWin = true;
    logEvent("flat_corner_card", { min_quality: s.min_quality });
    if (!tut) {
      showCard("Good start!",
        TUT_SVG.flatfix
        + "<div>The numbers add up — but that new dot lies <b>flat</b> (180&deg;), too squished for a real tile. We can do a little better: a dot on every side, meeting in the middle.</div>",
        "Keep going", hideCard, hideCard);
    }
  } else {
    wasNearWin = isNearWin;
  }
}

function confettiBurst() {
  if (reducedMotion.matches) return;
  const canvas = document.getElementById("confetti");
  const stage = document.getElementById("stage");
  canvas.width = stage.clientWidth;
  canvas.height = stage.clientHeight;
  const ctx = canvas.getContext("2d");
  const style = getComputedStyle(document.documentElement);
  const colors = ["--good", "--accent", "--warn", "--bad"].map(t => style.getPropertyValue(t).trim());
  const parts = [];
  for (let i = 0; i < 140; i++) {
    parts.push({
      x: canvas.width / 2 + (Math.random() - 0.5) * canvas.width * 0.5,
      y: canvas.height * (0.25 + Math.random() * 0.2),
      vx: (Math.random() - 0.5) * 9,
      vy: -4 - Math.random() * 7,
      w: 5 + Math.random() * 5,
      h: 3 + Math.random() * 4,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.3,
      color: colors[i % colors.length],
    });
  }
  const t0 = performance.now();
  function tick(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const alive = (t - t0) < 2600;
    for (const p of parts) {
      p.vy += 0.18; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, 1 - (t - t0) / 2600);
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      ctx.restore();
    }
    if (alive) requestAnimationFrame(tick);
    else ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
  requestAnimationFrame(tick);
}

// --- nearest-target picking -------------------------------------------------

function distToSegment(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const lsq = dx * dx + dy * dy;
  const t = lsq ? Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / lsq)) : 0;
  return Math.hypot(px - (ax + t * dx), py - (ay + t * dy));
}

function pickTarget(mx, my) {
  if (mode === "insert_vertex" || mode === "delete_edge") {
    let best = null, bestDist = EDGE_PICK_RADIUS;
    for (const e of hitEdges) {
      if (mode === "delete_edge" && !e.deletable) continue;
      if (!tutAllows("edge", e.id)) continue;
      for (let i = 0; i + 1 < e.samples.length; i++) {
        const d = distToSegment(mx, my, ...e.samples[i], ...e.samples[i + 1]);
        if (d < bestDist) { bestDist = d; best = { kind: "edge", id: e.id }; }
      }
    }
    return best;
  }
  let best = null, bestDist = VERTEX_PICK_RADIUS;
  for (const v of hitVerts) {
    if (!v.eligible) continue;
    if (!tutAllows("vertex", v.id)) continue;
    const d = Math.hypot(mx - v.x, my - v.y);
    if (d < bestDist) { bestDist = d; best = { kind: "vertex", id: v.id }; }
  }
  return best;
}

function setHover(target) {
  const svg = document.getElementById("canvas");
  if (hoverTarget && (!target || target.kind !== hoverTarget.kind || target.id !== hoverTarget.id)) {
    const old = svg.querySelector(
      hoverTarget.kind === "edge"
        ? `[data-edge="${hoverTarget.id}"]` : `circle[data-vertex="${hoverTarget.id}"]`);
    if (old) old.classList.remove("near");
  }
  if (target) {
    const el = svg.querySelector(
      target.kind === "edge"
        ? `[data-edge="${target.id}"]` : `circle[data-vertex="${target.id}"]`);
    if (el) el.classList.add("near");
  }
  hoverTarget = target;
  svg.classList.toggle("has-target", !!target);
}

function mousePos(e) {
  const rect = document.getElementById("canvas").getBoundingClientRect();
  return [e.clientX - rect.left, e.clientY - rect.top];
}

const canvasEl = document.getElementById("canvas");
let panState = null;
let suppressClick = false;

canvasEl.addEventListener("mousemove", e => {
  if (!state || panState?.moved) return;
  setHover(pickTarget(...mousePos(e)));
});
canvasEl.addEventListener("mouseleave", () => setHover(null));
canvasEl.addEventListener("pointerdown", e => {
  if (!state) return;
  // touch: no hover exists, so preview the picked target on finger-down;
  // the click that follows on finger-up commits it
  if (e.pointerType === "touch") setHover(pickTarget(...mousePos(e)));
  panState = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false };
  canvasEl.setPointerCapture(e.pointerId);
});
canvasEl.addEventListener("pointermove", e => {
  if (!panState) return;
  if (e.pointerType === "mouse" && !(e.buttons & 1)) return;
  const dx = e.clientX - panState.sx, dy = e.clientY - panState.sy;
  if (!panState.moved && Math.hypot(dx, dy) <= 5) return;
  if (!panState.moved) {
    panState.moved = true;
    setHover(null);
    canvasEl.classList.add("panning");
  }
  view.x = panState.vx + dx;
  view.y = panState.vy + dy;
  queueRender();
});
window.addEventListener("pointerup", () => {
  if (panState?.moved) {
    saveView();
    suppressClick = true;
    canvasEl.classList.remove("panning");
  }
  panState = null;
});
canvasEl.addEventListener("click", e => {
  if (suppressClick) { suppressClick = false; return; }
  if (!state) return;
  const target = pickTarget(...mousePos(e));
  if (!target) {
    if (mode === "insert_edge" && selectedVertex !== null) { selectedVertex = null; render(); }
    return;
  }
  if (target.kind === "edge") {
    doOp(mode === "insert_vertex" ? "insert_vertex" : "delete_edge", { edge: target.id });
  } else if (mode === "delete_vertex") {
    doOp("delete_vertex", { vertex: target.id });
  } else if (mode === "insert_edge") {
    if (selectedVertex === null) { selectedVertex = target.id; render(); }
    else if (selectedVertex === target.id) { selectedVertex = null; render(); }
    else doOp("insert_edge", { a: selectedVertex, b: target.id });
  }
});

function setMode(m, force) {
  const s = tutStep();
  if (s && !force && (!s.require || s.mode !== m)) {
    toast("Follow the tutorial step — or skip it below");
    return;
  }
  mode = m;
  selectedVertex = null;
  document.querySelectorAll(".mode").forEach(b =>
    b.classList.toggle("active", b.dataset.mode === m));
  if (state) render();
}

document.querySelectorAll(".mode").forEach(b =>
  b.addEventListener("click", () => setMode(b.dataset.mode)));
document.getElementById("undo").addEventListener("click", () => {
  try { game.undo(); } catch (e) { toast(e.message); return; }
  refresh();
  logEvent("undo", { moves: state.moves });
  tutCheck({ op: "undo", verts: [] });
});
document.getElementById("smoothbtn").addEventListener("click", () => {
  game.smooth(3);
  refresh();
  logEvent("smooth");
});
function gotoShape(shape, evt) {
  if (tut) tutEnd(); // defensive: a level change always exits the tutorial
  hideCard(); // and dismisses whatever card was open
  game.reset(shape);
  refresh();
  logEvent(evt);
  maybeShowNote(state.shape);
}

document.getElementById("reset").addEventListener("click", () =>
  gotoShape(document.getElementById("shape").value, "new_game"));
document.getElementById("shape").addEventListener("change", e =>
  gotoShape(e.target.value, "level_change"));
document.getElementById("next").addEventListener("click", () => {
  const shapes = state.shapes;
  gotoShape(shapes[(shapes.indexOf(state.shape) + 1) % shapes.length], "level_next");
});
document.getElementById("prev").addEventListener("click", () => {
  const shapes = state.shapes;
  gotoShape(shapes[(shapes.indexOf(state.shape) - 1 + shapes.length) % shapes.length], "level_prev");
});
document.getElementById("tut-open").addEventListener("click", tutStart);
document.getElementById("star").addEventListener("click", () => logEvent("star_click"));
document.getElementById("log-export").addEventListener("click", () => {
  const blob = new Blob([JSON.stringify(activityLog, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "meshquest-log.json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast(`Exported ${activityLog.length} events`);
});
window.addEventListener("resize", () => state && render());
window.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  const keys = { 1: "insert_vertex", 2: "delete_vertex", 3: "insert_edge", 4: "delete_edge" };
  if (keys[e.key]) setMode(keys[e.key]);
  else if (e.key === "u") document.getElementById("undo").click();
  else if (e.key === "s") document.getElementById("smoothbtn").click();
  else if (e.key === "ArrowLeft") document.getElementById("prev").click();
  else if (e.key === "ArrowRight") document.getElementById("next").click();
  else if (e.key === " ") {
    const nextBtn = document.getElementById("tut-next");
    if (document.getElementById("tutcard").classList.contains("show")
        && !nextBtn.classList.contains("hidden")) {
      e.preventDefault();
      nextBtn.click();
    }
  }
});

setMode("insert_vertex");
refresh();
let tutorialDone = false;
try { tutorialDone = localStorage.getItem("meshquest-tutorial") === "done"; } catch {}
if (!tutorialDone) tutStart();
</script>
</body>
</html>
