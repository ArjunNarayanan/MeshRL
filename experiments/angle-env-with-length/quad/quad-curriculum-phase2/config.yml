########################################################################################
# quad-curriculum-phase2  —  FULL RANGE FINE-TUNE
#
# Load the Phase 1 checkpoint and continue training on the full polygon range.
# The agent already knows the global-split pattern from Phase 1; this phase
# transfers that knowledge to larger, more varied geometries.
#
# Run with finetune.py (not train.py):
#   python workflows/finetune.py \
#       -config experiments/angle-env-with-length/quad/quad-curriculum-phase2/config.yml \
#       -checkpoint experiments/angle-env-with-length/quad/quad-curriculum-phase1/best_model.zip \
#       -num_envs 8
#
# Key changes from Phase 1:
#   polygon range   : 6-20  (full training distribution)
#   ent_coef        : 1e-3  (reduce exploration once pattern is known)
#   learning_rate   : 3e-5  (lower LR for fine-tuning)
#   total_timesteps : 20M
########################################################################################

environment:
  name: AngleEnvWithLength
  initializer:
    name: RandomPolygon
    min_polygon_degree: 6
    max_polygon_degree: 20
    scale: 0.8
    target_angle: 90
  face_desired_degree: 4
  template_size: 20
  max_edge_addition_steps: 5
  max_steps_factor: 2
  face_reward_weight: 0.35
  vertex_reward_weight: 0.40
  angle_reward_weight: 0.25
  face_degree_threshold: 15
  vertex_degree_threshold: 8

feature_extractor:
  type: Convolution
  output_features: 128
  number_of_layers: 5

policy:
  use_critic: True
  ortho_init: False

PPO:
  gamma: 1.0
  n_steps: 1024
  batch_size: 512
  gae_lambda: 0.86
  ent_coef: 1.0e-3
  vf_coef: 0.1488
  clip_range: 0.189
  max_grad_norm: 1.3
  learning_rate: 3.0e-5

evaluator:
  num_evaluations: 200

total_timesteps: 20_000_000
