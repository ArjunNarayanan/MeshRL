########################################################################################
# NOTES: <Include any notes in this section about the experiment>
#   Hyperparameters obtained by running 50 trials on Optuna
#
########################################################################################

output_dir: /content/drive/MyDrive/MeshRL/experiments/triangle/
environment:
  name: AngleEnvWithLength
  initializer:
    name: RandomPolygon
    min_polygon_degree: 6
    max_polygon_degree: 20
    scale: 0.8
    target_angle: 60
  face_desired_degree: 3
  template_size: 20
  max_edge_addition_steps: 5
  max_steps_factor: 2
  face_reward_weight: 0.5
  vertex_reward_weight: 0.25
  angle_reward_weight: 0.25
  face_degree_threshold: 15
  vertex_degree_threshold: 10
feature_extractor:
  type: Convolution
  number_of_layers: 3
  output_features: 128
policy:
  use_critic: True
  ortho_init: True
PPO:
  gamma: 1.0
  n_steps: 1024
  batch_size: 512
  gae_lambda: 0.86
  ent_coef: 4.e-5
  vf_coef: 0.05
  clip_range: 0.15
  max_grad_norm: 2.0
  learning_rate: 1.e-4
evaluator:
  num_evaluations: 200
total_timesteps: 10_000_000