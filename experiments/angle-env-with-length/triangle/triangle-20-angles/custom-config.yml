########################################################################################
# NOTES: <Include any notes in this section about the experiment>
#   Hyperparameters obtained by running 50 trials on Optuna
#
########################################################################################

environment:
  name: AngleEnvWithLength
  initializer:
    name: Hexagon
    target_angle: 60
  face_desired_degree: 3
  template_size: 20
  max_edge_addition_steps: 5
  max_steps_factor: 4
  face_reward_weight: 0.5
  vertex_reward_weight: 0.25
  angle_reward_weight: 0.25
  face_degree_threshold: 15
  vertex_degree_threshold: 10
feature_extractor:
  type: Convolution
  number_of_layers: 3
  output_features: 128