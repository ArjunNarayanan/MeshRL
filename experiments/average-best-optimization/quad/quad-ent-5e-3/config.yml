########################################################################################
# NOTES: <Include any notes in this section about the experiment>
#   Hyperparameters obtained by running 50 trials on Optuna
#
########################################################################################

environment:
  name: AngleEnvWithLength
  initializer:
    name: RandomPolygon
    min_polygon_degree: 6
    max_polygon_degree: 20
    scale: 0.8
    target_angle: 90
  face_desired_degree: 4
  template_size: 30
  max_edge_addition_steps: 5
  max_steps_factor: 2
  face_reward_weight: 0.4
  vertex_reward_weight: 0.3
  angle_reward_weight: 0.3
  face_degree_threshold: 15
  vertex_degree_threshold: 8
feature_extractor:
  type: Convolution
  output_features: 512
  number_of_layers: 5
policy:
  use_critic: True
  ortho_init: False
PPO:
  gamma: 1.0
  n_steps: 1024
  batch_size: 512
  gae_lambda: 0.65
  ent_coef: 5.e-3
  vf_coef: 0.1
  clip_range: 0.20
  max_grad_norm: 1.0
  learning_rate: 5.e-5
evaluator:
  num_evaluations: 50
total_timesteps: 10_000_000