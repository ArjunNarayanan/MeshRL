environment:
  name: RegularPolygonEnv
  polygon_degree: 6
  template_size: 12
  max_substeps: 10
  max_steps: 5
  incremental_reward: False
  no_action_reward: None
  logdir: None
feature_extractor:
  output_features: 128
  number_of_layers: 5
PPO:
  ent_coef: 0.1
  vf_coef: 0.1
  clip_range: 0.05
  learning_rate: 1.e-4
  batch_size: 256
evaluator:
  eval_freq: 5000
total_timesteps: 10_000_000

